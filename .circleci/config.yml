version: 2.1

jobs:
  resc:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build artifact C
          command: |
            mkdir -p /var/tmp/outq
            set +o pipefail 2>/dev/null; combine() { seq 1 $1 ; yes 'x' | head -n $1 ; }; combine 10000 > /var/tmp/outq/trial-51v; true
            echo "wrote (β)"
      - persist_to_workspace:
          root: /var/tmp/outq
          paths:
            - 'trial-51v'
  andromeda:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/outq
      - run:
          name: Fetch stage 3
          command: |
            # collect info
            sz=$(wc -c < /var/tmp/outq/trial-51v 2>/dev/null || echo ?)
            ln=$(wc -l < /var/tmp/outq/trial-51v 2>/dev/null || echo ?)
            echo "sz=$sz ln=$ln"
      - run:
          name: Clone sources
          command: git clone --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: cat final-static-stage.tar | tar xf -
      - run:
          command: /bin/sh -c "./route-subscriber"
